# Mackup configuration - app settings backup (copy mode).
#
# Linked to ~/.config/mackup/mackup.cfg by script/bootstrap (the
# mackup/config/** convention).
#
# Mackup reads exactly ONE config file, the first that exists:
#   ~/.mackup.cfg  ->  $MACKUP_CONFIG  ->  ~/.config/mackup/mackup.cfg
# It does NOT merge them. A per-machine ~/.mackup.cfg therefore replaces
# this whole file, including the whitelist below. A ~/.mackup.cfg that only
# sets [storage] makes Mackup back up EVERY supported app - including ssh,
# git and zsh. To vary storage per machine, symlink the storage folder
# instead (see below); never create a partial ~/.mackup.cfg.
#
# Copy mode only: use `mackup backup` and `mackup restore`.
# NEVER run `mackup link` - it replaces app files with symlinks and
# corrupts preferences on macOS 14+.
#
# All options below exist in Mackup 0.11.x.
# Full docs: https://github.com/lra/mackup/tree/master/doc

[storage]
engine = file_system

# `path` is resolved relative to your home directory by Mackup, and
# `directory` (default: Mackup) is appended to it. So `path = .` +
# `directory = Mackup` means backups live in ~/Mackup.
#
# This file is shared by every machine, so the storage location must not be
# hardcoded here. Point ~/Mackup at a synced folder on each machine:
#
#   mkdir -p "$HOME/Library/CloudStorage/<provider>/Mackup"
#   ln -s "$HOME/Library/CloudStorage/<provider>/Mackup" "$HOME/Mackup"
#
# A Proton Drive / MEGA folder under ~/Library/CloudStorage works; mark it
# "Available offline", because cloud-file providers otherwise leave
# online-only placeholders Mackup cannot restore from. If the sync folder is
# missing, Mackup fails loudly instead of writing a local-only backup.
path = .
directory = Mackup

# Alternative: iCloud Drive
# engine = icloud

# Alternative: Dropbox
# engine = dropbox

# Whitelist: only these apps are backed up. Without this section Mackup
# backs up EVERY supported app - including ssh, git, zsh, vim, starship,
# mise and bat - which would fight the dotfiles symlinks and copy
# ~/.ssh to your cloud storage.
#
# Custom apps (defined in ~/.config/mackup/applications/, linked from
# mackup/config/applications/ in this repo):
[applications_to_sync]
pcsx2
duckstation
raycast

# Built-in apps (name = the .cfg filename in Mackup's applications dir):
obs
rectangle
fork
tableplus
keka
iina
vlc
transmission
switchhosts
daisydisk
