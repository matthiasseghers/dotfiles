# Mackup configuration — app settings backup (copy mode).
#
# This file is linked to ~/.config/mackup/mackup.cfg by script/bootstrap
# (the mackup/config/** convention). Mackup reads it automatically: when
# no ~/.mackup.cfg exists, it falls back to ~/.config/mackup/mackup.cfg.
#
# Copy mode only: use `mackup backup` and `mackup restore`.
# NEVER run `mackup link` — it replaces app files with symlinks and
# corrupts preferences on macOS 14+.
#
# The storage path below is shared by every machine that uses this repo.
# For a per-machine storage location, create ~/.mackup.cfg instead — it
# takes precedence over this file (see Mackup's config.py search order).
#
# All options below exist in Mackup 0.11.x.
# Full docs: https://github.com/lra/mackup/tree/master/doc

[storage]
engine = file_system

# `path` is resolved relative to your home directory by Mackup, and
# `directory` (default: Mackup) is appended to it. So `path = .` +
# `directory = Mackup` means backups live in ~/Mackup.
# Point `path` at a synced folder to make this a real backup, e.g. a
# Proton Drive folder under ~/Library/CloudStorage/ (run
# `ls ~/Library/CloudStorage` for the exact name) and mark it
# "Available offline" — cloud-file providers otherwise leave
# online-only placeholders that Mackup cannot restore from.
path = .
directory = Mackup

# Alternative: iCloud Drive
# engine = icloud

# Alternative: Dropbox
# engine = dropbox

# Alternative: any synced folder. Create a per-machine ~/.mackup.cfg
# (it takes precedence over this file) with e.g.:
#   [storage]
#   engine = file_system
#   path = Library/CloudStorage/<your-synced-folder>
#   directory = Mackup

# Whitelist: only these apps are backed up. Without this section Mackup
# backs up EVERY supported app — including ssh, git, zsh, vim, starship,
# mise and bat — which would fight the dotfiles symlinks and copy
# ~/.ssh to your cloud storage.
#
# Custom apps (defined in ~/.config/mackup/applications/, linked from
# mackup/config/applications/ in this repo):
[applications_to_sync]
pcsx2
duckstation
retroarch
raycast

# Built-in apps (name = the .cfg filename in Mackup's applications dir):
obs
rectangle
fork
tableplus
keka
iina
vlc
transmission
switchhosts
daisydisk
