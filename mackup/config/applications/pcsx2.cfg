# PCSX2 - settings, BIOS, memory cards, per-game settings, input profiles.
# Not synced: cache, covers, textures, shaders, savestates, snapshots,
# videos, logs.
[application]
name = PCSX2

[configuration_files]
Library/Preferences/net.pcsx2.pcsx2.plist
# Only PCSX2.ini - secrets.ini (RetroAchievements token) is deliberately excluded.
Library/Application Support/PCSX2/inis/PCSX2.ini
Library/Application Support/PCSX2/bios
Library/Application Support/PCSX2/memcards
Library/Application Support/PCSX2/gamesettings
Library/Application Support/PCSX2/inputprofiles
