# Raycast - minimal on purpose.
#
# The real data (snippets, quicklinks, hotkeys) lives in an encrypted
# local database under ~/Library/Application Support/com.raycast.macos
# (main.db + last_key) that does not restore usefully. For a full backup
# use Raycast itself: Settings → Advanced → Export (.rayconfig file).
#
# ~/.config/raycast is NOT synced as a directory: Mackup copies
# directories recursively and would follow the extensions/node_modules
# symlink into the Raycast.app bundle. Only plain files are listed.
[application]
name = Raycast

[configuration_files]
Library/Preferences/com.raycast.macos.plist

[xdg_configuration_files]
raycast/aster-endpoint.json
