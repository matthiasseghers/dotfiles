repos:
  - repo: local
    hooks:
      - id: no-duplicate-aliases
        name: Check for duplicate aliases
        language: script
        entry: script/check-aliases
        files: \.zsh$

      - id: no-dangerous-symlinks
        name: Check for dangerous symlink targets
        language: script
        entry: script/check-symlinks
        files: \.symlink$

      - id: shell-syntax-bash
        name: Shell syntax (bash)
        language: system
        entry: bash -n
        files: ^(script/|bin/)
        # Ruby scripts (extensionless, shebang-dispatched) live in bin/ too.
        exclude: ^bin/git-(rank-contributors|wtf)$

      - id: shell-syntax-zsh
        name: Shell syntax (zsh)
        language: system
        entry: zsh -n
        files: \.zsh$

      - id: no-hardcoded-dotfiles-path
        name: No hardcoded ~/.dotfiles path
        language: pygrep
        entry: '\$HOME/\.dotfiles|~/\.dotfiles'
        files: \.(zsh|symlink|sh)$|^(bin/|script/)

  - repo: https://github.com/shellcheck-py/shellcheck-py
    rev: v0.11.0.1
    hooks:
      - id: shellcheck
        # Only POSIX/bash scripts; zsh files (functions/*, *.zsh) are not
        # shellcheck-parseable (macos/aliases.zsh would match the path filter).
        files: ^(script/|bin/|macos/)
        exclude: \.zsh$

  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.0
    hooks:
      - id: gitleaks
